<style>
:root{
  --font:'Nunito','Varela Round','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'Cascadia Code','SFMono-Regular',Menlo,Consolas,monospace;
  --line:#4a3b5c;
  --r:22px;
  --accent:#2fb3c6;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme=sylveon]{--bg1:#ffe1ef;--bg2:#d6ecff;--card:#ffffff;--card2:#fff4fa;--ink:#3d2f55;--ink2:#665a80;--pri:#f2559c;--pri2:#c93a7c;--on-pri:#fff;--sec:#6cbcf5;--en:#b0246a;--glow:rgba(242,85,156,.32);--shadow:rgba(120,70,140,.18);--chip:#fde6f1;--good:#1f8f6c;--soft:#c4602f;--track:#f3dcea;--nuvi:#cdb8f5}
html[data-theme=umbreon]{--bg1:#1b1937;--bg2:#2f2b63;--card:#2b2858;--card2:#353171;--ink:#f6f1ff;--ink2:#cfc7ee;--pri:#f2c14e;--pri2:#b8891c;--on-pri:#2a2150;--sec:#8f9bff;--en:#ffd76a;--glow:rgba(242,193,78,.42);--shadow:rgba(0,0,0,.38);--chip:#3d3986;--good:#7ee8c0;--soft:#ffbf99;--track:#45418a;--nuvi:#b9a8f0}
html[data-theme=mew]{--bg1:#ffe4ef;--bg2:#d3f7f0;--card:#ffffff;--card2:#f1fffb;--ink:#3a3150;--ink2:#625a7c;--pri:#e85d9f;--pri2:#bf3f7c;--on-pri:#fff;--sec:#34bfae;--en:#0b7a6e;--glow:rgba(52,191,174,.38);--shadow:rgba(60,110,120,.2);--chip:#dcf8f2;--good:#1b8a68;--soft:#bf5a2a;--track:#d9efe9;--nuvi:#cdb8f5}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2)) fixed;font-size:17px;line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body.dys{--font:'Lexend','OpenDyslexic','Verdana',sans-serif;letter-spacing:.03em;word-spacing:.12em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
svg{display:block}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--sec);outline-offset:3px}

#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:screenIn .25s ease-out}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.pad{padding:14px 16px}

.en{color:var(--en);font-weight:800;font-size:1.12em;letter-spacing:.01em}
.de-hint{color:var(--ink2);font-size:.92em}
.muted{color:var(--ink2)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.scroll.stack>*{flex-shrink:0}

/* ---------- buttons ---------- */
.btn{--b:var(--card);--bs:var(--shadow);min-height:52px;padding:12px 20px;border:0;border-radius:18px;background:var(--b);color:var(--ink);font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 var(--bs),0 8px 18px var(--shadow);transition:transform .08s ease,box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;user-select:none;-webkit-user-select:none}
.btn:active,.btn.pressed{transform:translateY(4px) scale(.98,.96);box-shadow:0 1px 0 var(--bs),0 3px 8px var(--shadow)}
.btn.pri{background:linear-gradient(180deg,var(--pri),var(--pri2));color:var(--on-pri);--bs:color-mix(in srgb,var(--pri2) 70%,#000);text-shadow:0 1px 0 rgba(0,0,0,.18)}
html[data-theme=umbreon] .btn.pri{text-shadow:none}
.btn.big{min-height:64px;font-size:1.25rem;padding:16px 28px;border-radius:22px}
.btn.block{width:100%}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2);min-height:48px}
.btn.small{min-height:48px;padding:8px 14px;font-size:.95rem;border-radius:14px}
.btn svg{width:22px;height:22px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{width:48px;height:48px;min-width:48px;border-radius:16px;border:0;background:var(--card);box-shadow:0 4px 0 var(--shadow);display:inline-grid;place-items:center;color:var(--ink);transition:transform .08s;position:relative}
.ibtn:active{transform:translateY(3px) scale(.95)}
.ibtn svg{width:26px;height:26px}
.ibtn.on{background:var(--chip);outline:2px solid var(--sec)}
.dot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--pri);border:2px solid var(--card)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.92rem;min-height:36px}
.chip svg{width:20px;height:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 6px 18px var(--shadow);padding:16px}
.tag{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* ---------- start / onboarding ---------- */
.start{justify-content:space-between;align-items:center;text-align:center;padding:24px 20px calc(24px + var(--safe-b));position:relative}
.start h1{font-size:2rem;line-height:1.1;margin:8px 0 4px;font-weight:900}
.start .sub{color:var(--ink2);font-weight:700;margin:0}
.hero{width:min(62vw,250px);margin:8px auto;animation:bounce 2.6s ease-in-out infinite}
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparkles i{position:absolute;width:14px;height:14px;animation:twinkle 2.4s ease-in-out infinite}
.onb{padding:20px 18px calc(18px + var(--safe-b));gap:16px;justify-content:space-between}
.steps{display:flex;gap:8px;justify-content:center}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.steps i.on{background:var(--pri);width:26px;border-radius:6px}
.namein{width:100%;min-height:60px;border-radius:18px;border:3px solid var(--track);background:var(--card);padding:10px 16px;font-size:1.4rem;font-weight:800;text-align:center}
.namein:focus{border-color:var(--sec);outline:none}
.avgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.avbtn{border:0;background:var(--card);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--shadow);min-height:120px;transition:transform .1s}
.avbtn svg{width:100%;max-width:120px;margin:auto}
.avbtn[aria-pressed=true]{outline:4px solid var(--pri);transform:scale(1.03)}

/* ---------- companion (Nuvi) ---------- */
.nuvi{overflow:visible}
.nuvi .nv-all{transform-origin:60px 110px;animation:idle 3.2s ease-in-out infinite}
.nuvi .nv-eyes{transform-origin:60px 70px;animation:blink 4.6s infinite}
.nuvi .nv-tail{transform-origin:88px 92px;animation:tail 1.8s ease-in-out infinite}
.nuvi .nv-earl{transform-origin:40px 44px;animation:ear 5s ease-in-out infinite}
.nuvi .nv-earr{transform-origin:80px 44px;animation:ear 5s ease-in-out infinite .4s}
.nuvi.cheer .nv-all{animation:hop .6s ease-in-out infinite}
.dock{display:flex;align-items:flex-end;gap:8px;padding:6px 12px 4px;min-height:74px}
.dock .mini{width:64px;height:64px;flex:none;cursor:pointer}
.bubble{position:relative;background:var(--card);border-radius:18px;padding:9px 12px;box-shadow:0 4px 14px var(--shadow);font-weight:700;font-size:.98rem;line-height:1.25;flex:1;display:flex;gap:6px;align-items:center;min-height:48px;animation:pop .25s ease-out}
.bubble::before{content:"";position:absolute;left:-7px;bottom:14px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.bubble .txt{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bubble.soft{background:color-mix(in srgb,var(--card) 85%,var(--soft) 15%)}

/* ---------- map ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.me{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--card);border-radius:18px;padding:4px 10px 4px 4px;box-shadow:0 4px 0 var(--shadow);border:0;min-height:52px;text-align:left}
.me .av{width:44px;height:44px;border-radius:14px;background:var(--chip);overflow:hidden;flex:none}
.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.me small{font-weight:800;color:var(--ink2);font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px;padding:0 12px 6px;flex-wrap:wrap}
.goal-ring{width:22px;height:22px}
.mapwrap{position:relative;padding:4px 12px 24px}
.unit{position:relative;border-radius:28px;margin:10px 0 18px;overflow:hidden;box-shadow:0 8px 22px var(--shadow);background:var(--card)}
.unit-head{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.unit-head h2{margin:0;font-size:1.25rem;font-weight:900}
.unit-head .mon{width:58px;height:58px;flex:none}
.unit-scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.unit-scene svg{width:100%;height:100%}
.path{position:relative;z-index:1}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;background:var(--card);box-shadow:0 6px 0 var(--shadow),0 10px 18px var(--shadow);display:grid;place-items:center;padding:0;transition:transform .1s}
.node:active{transform:translate(-50%,-46%) scale(.95)}
.node svg.ic{width:40px;height:40px}
.node.done{background:linear-gradient(180deg,#fff,var(--chip))}
html[data-theme=umbreon] .node.done{background:linear-gradient(180deg,#45408f,#2f2b63)}
.node.locked{filter:grayscale(.8);opacity:.75}
.node.next{background:linear-gradient(180deg,var(--pri),var(--pri2));color:var(--on-pri);animation:pulse 1.6s ease-in-out infinite}
.node.boss{width:92px;height:92px;border-radius:30px}
.node .stars{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .stars svg{width:18px;height:18px}
.node .lbl{color:var(--ink);position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:.8rem;background:var(--card);padding:2px 8px;border-radius:10px;box-shadow:0 2px 6px var(--shadow);max-width:140px;overflow:hidden;text-overflow:ellipsis}
.node .lock{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 4px var(--shadow)}
.node .lock svg{width:16px;height:16px}
.node.secret{background:radial-gradient(circle,#fff6c9,#ffd76a);animation:glow 2s ease-in-out infinite}
.node.secret.done{animation:none}
.nuvi-pin{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.spark-btn{position:absolute;width:48px;height:48px;border:0;background:transparent;padding:10px;z-index:2}
.spark-btn svg{width:28px;height:28px;animation:twinkle 1.8s ease-in-out infinite}
.soon{position:relative;padding:16px;display:flex;gap:12px;align-items:center;border-radius:24px;margin:12px 0;background:var(--card);box-shadow:0 6px 16px var(--shadow);opacity:.92}
.soon .mon{width:60px;height:60px;flex:none}
.soon h3{margin:0;font-size:1.05rem}
.ribbon{position:absolute;top:10px;right:-4px;background:var(--accent);color:#fff;font-weight:900;font-size:.72rem;padding:4px 10px;border-radius:8px 0 0 8px;letter-spacing:.04em}
.banner{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px;margin:6px 0 10px;background:linear-gradient(120deg,var(--card),var(--chip));box-shadow:0 6px 16px var(--shadow)}
.banner svg{width:46px;height:46px;flex:none}
.banner .btn{flex:none}
.debugbox{font-family:var(--mono);font-size:.75rem;white-space:pre-wrap;background:#1f1b33;color:#e8e2ff;padding:10px;border-radius:12px;overflow-wrap:anywhere}

.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(8px + var(--safe-b));background:var(--card);box-shadow:0 -6px 18px var(--shadow);border-radius:24px 24px 0 0}
.nav button{border:0;background:transparent;min-height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:.78rem;color:var(--ink2)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current=page]{background:var(--chip);color:var(--ink)}

/* ---------- level ---------- */
.lvtop{display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
.bar{flex:1;height:16px;border-radius:10px;background:var(--track);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--sec),var(--pri));border-radius:10px;transition:transform .35s ease}
.hintbtn{width:auto;padding:0 10px;gap:4px;font-weight:900}
.hintbtn small{font-size:.75rem}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px 10px;min-height:0;display:flex;flex-direction:column}
.task{display:flex;flex-direction:column;gap:12px;flex:1;animation:taskIn .3s ease-out}
.q{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.02rem}
.q svg.qi{width:30px;height:30px;flex:none}
.q .txt{flex:1}
.q .ibtn{width:48px;height:48px;min-width:48px;box-shadow:none;background:var(--chip)}
.foot{padding:8px 14px calc(10px + var(--safe-b))}
.abar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.abar .btn{min-height:50px;padding:8px 14px;font-size:.95rem}
.abar .btn svg{width:22px;height:22px}
.reveal{text-align:center;font-size:1.5rem;min-height:1.6em}
.timer{font-weight:900;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.n3{grid-template-columns:repeat(3,1fr)}
.opt{border:0;border-radius:22px;background:var(--card);box-shadow:0 6px 0 var(--shadow),0 8px 16px var(--shadow);padding:8px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s,opacity .3s;position:relative}
.opt svg.pic{width:100%;max-width:130px;aspect-ratio:1}
.opt:active{transform:translateY(4px) scale(.97)}
.opt.gone{opacity:0;transform:scale(.6);pointer-events:none}
.opt.right{outline:4px solid var(--good);animation:joy .5s ease}
.opt.miss{animation:wobble .45s ease}
.opt.hintme{animation:pulse 1.1s ease-in-out infinite;outline:4px dashed var(--sec)}
.opt .cap{font-weight:800}
.opt.txt{min-height:64px;font-size:1.1rem;padding:12px}
.pointer{position:absolute;width:52px;height:52px;pointer-events:none;z-index:5;animation:point 1.1s ease-in-out infinite}

.ballrow{display:flex;justify-content:center;align-items:center;gap:10px}
.ballchip{display:flex;align-items:center;gap:10px;border:0;background:var(--card);border-radius:999px;padding:6px 18px 6px 6px;box-shadow:0 6px 0 var(--shadow),0 10px 20px var(--glow);min-height:64px;touch-action:none;user-select:none;-webkit-user-select:none}
.ballchip svg{width:52px;height:52px}
.ballchip .en{font-size:1.5rem}
.ballchip.drag{z-index:20;position:relative;transition:none;box-shadow:0 14px 24px var(--glow)}
.flyball{position:fixed;width:52px;height:52px;z-index:50;pointer-events:none;transition:transform .45s cubic-bezier(.3,.7,.4,1)}
.bigpic{width:min(46vw,190px);margin:0 auto}
.bigword{text-align:center;font-size:2rem;line-height:1.15}
.bigword .en{font-size:1em}
.ex{background:var(--card2);border-radius:16px;padding:10px 12px;font-weight:700}
.pron{font-size:.9rem;color:var(--ink2);font-weight:700}

.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:46px;height:54px;border-radius:12px;border:3px dashed var(--track);background:var(--card);display:grid;place-items:center;font-size:1.5rem;font-weight:900;color:var(--en);padding:0}
.slot.filled{border-style:solid;border-color:var(--sec)}
.slot.lockd{border-color:var(--good);background:var(--chip)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{min-width:52px;min-height:56px;border-radius:14px;border:0;background:var(--card);box-shadow:0 5px 0 var(--shadow);font-size:1.5rem;font-weight:900;color:var(--en);padding:4px 12px;transition:transform .1s,opacity .2s}
.tile:active{transform:translateY(3px)}
.tile.used{opacity:.25;pointer-events:none}
.typebox{display:flex;align-items:center;gap:0;background:var(--card);border-radius:18px;border:3px solid var(--track);padding:0 12px;min-height:62px}
.typebox:focus-within{border-color:var(--sec)}
.typebox .pre{font-size:1.6rem;font-weight:900;color:var(--en)}
.typebox input{border:0;background:transparent;font-size:1.6rem;font-weight:900;color:var(--en);flex:1;min-width:0;padding:8px 0;outline:none}
.fix{background:var(--chip);border-radius:16px;padding:10px 12px;font-weight:800;text-align:center}

/* code editor look */
.code{background:#231d3a;color:#efe9ff;border-radius:18px;padding:12px 12px 12px 8px;font-family:var(--mono);font-size:1rem;box-shadow:0 8px 20px rgba(20,10,40,.3);overflow-x:auto}
.code .ln{display:flex;gap:10px;align-items:flex-start;min-height:30px;padding:2px 0}
.code .num{color:#7c70a8;width:18px;text-align:right;flex:none;user-select:none}
.code .cm{color:#9f93c9;font-style:italic}
.code .kw{color:#ff9ad5}
.code .st{color:#9be7b4}
.code .op{color:#ffd27a}
.code .va{color:#9cd2ff}
.code .en{color:#ffe08a;font-size:1em}
.code .line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;flex:1}
.code .cur{display:inline-block;width:10px;height:24px;background:#ffd27a;animation:caret 1s steps(1) infinite}
.code .placed{border:0;background:#3a3160;border-radius:10px;padding:6px 10px;min-height:44px;font-family:var(--mono);font-size:1.05rem;font-weight:700}
.code .placed.lockd{background:#2f5b4b}
.console{font-family:var(--mono);border-radius:14px;padding:10px 12px;font-weight:700;background:#14112a;color:#c9f7d8}
.console.meh{color:#ffd6a6}
.ctile{font-family:var(--mono);font-size:1.1rem;color:var(--ink)}
.ctile.kw{color:#c2187a}.ctile.st{color:#16805a}.ctile.op{color:#a2620b}.ctile.va{color:#1b62b5}
html[data-theme=umbreon] .ctile.kw{color:#ff9ad5}
html[data-theme=umbreon] .ctile.st{color:#9be7b4}
html[data-theme=umbreon] .ctile.op{color:#ffd27a}
html[data-theme=umbreon] .ctile.va{color:#9cd2ff}
.snip{border-radius:14px;overflow:hidden}
.snip .tag{padding:6px 2px}

.q>svg:first-child{width:30px;height:30px;flex:none;color:var(--pri)}
.node .ic svg{width:40px;height:40px}
.target .tp{width:84px;flex:none}
.target .tp svg{width:84px;height:84px}
.target .btn{min-width:48px;flex:none}
/* bug hunt */
.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;background:var(--card);border-radius:22px;box-shadow:0 6px 16px var(--shadow)}
.tok{border:0;border-radius:14px;padding:10px 14px;min-height:52px;background:var(--chip);font-size:1.35rem;font-weight:800;color:var(--en)}
.tok.ok{opacity:.55;text-decoration:underline wavy var(--good)}
.tok.bug{outline:3px dashed var(--soft);animation:wobble .5s ease}
.tok.fixed{outline:3px solid var(--good);background:var(--card)}
.tok.glow{box-shadow:0 0 0 6px var(--glow)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-aspect-ratio:1/1){.mem{grid-template-columns:repeat(4,1fr)}}
.mcard{border:0;padding:0;background:transparent;aspect-ratio:1/1.05;perspective:600px;min-height:80px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 var(--shadow)}
.mcard .b{background:linear-gradient(160deg,var(--pri),var(--sec))}
.mcard .b svg{width:52%}
.mcard .f{background:var(--card);transform:rotateY(180deg);padding:6px;text-align:center}
.mcard .f svg{width:88%}
.mcard .f .en{font-size:1.15rem;line-height:1.1}
.mcard.done .f{outline:4px solid var(--good)}
.mcard.peek .b{box-shadow:0 0 0 5px var(--glow),0 5px 0 var(--shadow)}

/* dialogue */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:pop .25s ease-out}
.msg .who{width:46px;height:46px;flex:none;border-radius:14px;background:var(--chip);overflow:hidden}
.msg .bub{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 12px var(--shadow);max-width:78%}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bub{background:var(--chip)}
.msg .bub .en{font-size:1.2rem}
.msg .tools{display:flex;gap:6px;margin-top:6px}
.msg .tools .ibtn{width:48px;height:48px;min-width:48px;box-shadow:none;background:var(--chip)}
.msg .de{display:block;margin-top:4px}
.choices{display:flex;flex-direction:column;gap:10px}
.choices .btn{justify-content:flex-start;text-align:left}
.choices .btn.miss{animation:wobble .45s;opacity:.45;pointer-events:none}
.story{font-weight:800;color:var(--ink2);text-align:center;font-size:.95rem}

/* falling */
.arena{position:relative;flex:1;min-height:280px;border-radius:24px;background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 22%,transparent),color-mix(in srgb,var(--pri) 14%,transparent));overflow:hidden}
.drop{position:absolute;top:0;width:31%;border:0;border-radius:24px;background:var(--card);box-shadow:0 5px 0 var(--shadow),0 0 0 3px color-mix(in srgb,var(--sec) 50%,transparent);padding:10px 6px;min-height:58px;font-weight:800;will-change:transform}
.drop .en{font-size:1.05rem;line-height:1.1}
.drop.miss{opacity:.35}
.drop.glow{box-shadow:0 0 0 6px var(--glow),0 5px 0 var(--shadow)}
.target{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:8px;box-shadow:0 5px 14px var(--shadow)}
.target svg.pic{width:84px;height:84px;flex:none}

/* boss */
.boss{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:6px 12px;margin:4px 12px 0;box-shadow:0 4px 12px var(--shadow)}
.boss svg{width:74px;height:56px;flex:none}
.boss .hp{flex:1;height:14px;border-radius:8px;background:var(--track);overflow:hidden}
.boss .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb38a,#ff7fa8);transform-origin:left;transition:transform .5s}
.boss.hit svg{animation:wobble .4s}

/* speak */
.speakrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rate{display:grid;grid-template-columns:1fr;gap:8px}
.recdot{width:14px;height:14px;border-radius:50%;background:#ff5d7a;animation:pulse 1s infinite}

/* result / reward */
.result{overflow-y:auto;align-items:center;text-align:center;justify-content:space-between;padding:18px 18px calc(16px + var(--safe-b));gap:10px}
.bigstars{display:flex;gap:6px;justify-content:center}
.bigstars svg{width:68px;height:68px}
.bigstars svg.on{animation:starIn .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars svg:nth-child(2){animation-delay:.15s;transform:translateY(-10px)}
.bigstars svg:nth-child(3){animation-delay:.3s}
.gains{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gift{width:150px;margin:0 auto;border:0;background:transparent;padding:0;animation:giftWiggle 1.2s ease-in-out infinite}
.gift svg{width:100%}
.prize{animation:prizeIn .6s cubic-bezier(.3,1.6,.5,1) both}
.prize svg{width:130px;height:130px;margin:0 auto}
.evo{width:64px;flex:none;animation:prizeIn .6s cubic-bezier(.3,1.6,.5,1) both}
.evo svg{width:100%;height:auto}
.row>b{min-width:0}
.glowdisc{background:radial-gradient(circle,var(--glow),transparent 70%);border-radius:50%;padding:10px}

/* album / shop / room */
.tabs{display:flex;gap:6px;padding:4px 12px 8px}
.tabs button{flex:1;min-height:48px;border:0;border-radius:14px;background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--shadow)}
.tabs button[aria-selected=true]{background:linear-gradient(180deg,var(--pri),var(--pri2));color:var(--on-pri)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slotcard{background:var(--card);border-radius:20px;padding:10px;text-align:center;box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:center;position:relative}
.slotcard svg.it{width:72px;height:72px;margin:auto}
.slotcard.locked svg.it{filter:grayscale(1) brightness(.4);opacity:.45}
.slotcard b{font-size:.9rem;line-height:1.15}
.inv{background:repeating-linear-gradient(45deg,var(--card2),var(--card2) 8px,var(--card) 8px,var(--card) 16px);border:3px solid var(--track);border-radius:16px}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:900}
.price svg{width:18px;height:18px}
.wordrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 var(--shadow)}
.wordrow svg.pic{width:48px;height:48px;flex:none}
.wordrow .grow{min-width:0}
.boxes{display:flex;gap:2px}
.boxes i{width:10px;height:10px;border-radius:3px;background:var(--track)}
.boxes i.on{background:var(--sec)}
.room{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:0 8px 20px var(--shadow)}
.room>svg{position:absolute;inset:0;width:100%;height:100%}
.room .ri{position:absolute;transform:translate(-50%,-100%)}
.room .ri svg{width:100%;height:auto}
.room .ra{position:absolute;left:50%;bottom:4%;width:26%;transform:translateX(-50%)}
.mon-big{width:150px;height:150px;margin:auto}

/* settings / parent */
.set{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;min-height:60px;box-shadow:0 3px 0 var(--shadow)}
.set .grow b{display:block}
.set small{color:var(--ink2);font-weight:700}
.switch{width:76px;height:48px;border-radius:999px;border:0;background:var(--track);position:relative;flex:none;min-height:48px;padding:0}
.switch::after{content:"";position:absolute;top:6px;left:6px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked=true]{background:var(--good)}
.switch[aria-checked=true]::after{transform:translateX(28px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes button{border:0;border-radius:18px;min-height:96px;font-weight:900;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;color:#3a2f52}
.themes button[aria-pressed=true]{outline:4px solid var(--pri)}
.th-sylveon{background:linear-gradient(160deg,#ffc8e1,#bfe1ff)}
.th-umbreon{background:linear-gradient(160deg,#1b1937,#3a3580);color:#ffd76a!important}
.th-mew{background:linear-gradient(160deg,#ffc9e0,#b6f0e6)}
select.sel{min-height:48px;border-radius:14px;border:2px solid var(--track);background:var(--card);padding:6px 10px;font-weight:800}
textarea.ta{width:100%;min-height:110px;border-radius:14px;border:2px solid var(--track);background:var(--card2);font-family:var(--mono);font-size:.75rem;padding:8px}
.warn{background:color-mix(in srgb,var(--soft) 18%,var(--card));border-radius:16px;padding:10px 12px;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keypad .btn{min-height:60px;font-size:1.4rem}
.pins{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pins i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink2)}
.pins i.on{background:var(--ink2)}
.hold{position:relative;overflow:hidden}
.hold .ring{position:absolute;inset:0;border-radius:inherit;background:var(--glow);transform:scaleX(0);transform-origin:left}
.hold.holding .ring{transform:scaleX(1);transition:transform 1.4s linear}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--track);text-align:left}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:800;color:var(--ink2);height:100%;justify-content:flex-end}
.bars div i{display:block;width:100%;background:var(--sec);border-radius:6px 6px 2px 2px;min-height:2px}

/* sheet & toast */
.sheet-back{position:absolute;inset:0;background:rgba(40,25,60,.25);z-index:40;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:28px 28px 0 0;padding:18px 16px calc(16px + var(--safe-b));box-shadow:0 -10px 30px var(--shadow);animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.1);max-height:88%;overflow-y:auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--track);margin:-6px auto 12px}
.sheet h2{margin:4px 0 8px;font-size:1.35rem}
.toast{position:absolute;left:12px;right:12px;bottom:calc(92px + var(--safe-b));z-index:45;display:flex;gap:8px;align-items:center;animation:pop .25s}
.toast .bubble{box-shadow:0 8px 24px var(--shadow)}

/* particles */
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:60;width:18px;height:18px;animation:burst .8s ease-out forwards}

/* animations (transform/opacity only) */
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes taskIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(.96,1.05)}80%{transform:translateY(0) scale(1.06,.94)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
@keyframes ear{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(5deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
.opt.hintme,.recdot{animation-name:pulse2}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes glow{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1) rotate(4deg)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes joy{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.08)}100%{transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes point{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-10px)}}
@keyframes caret{50%{opacity:0}}
@keyframes starIn{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1}}
@keyframes giftWiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-6deg) scale(1.03)}85%{transform:rotate(6deg) scale(1.03)}}
@keyframes prizeIn{from{opacity:0;transform:scale(.2) translateY(30px)}to{opacity:1;transform:none}}
@keyframes burst{from{opacity:1;transform:translate(var(--x0),var(--y0)) scale(1)}to{opacity:0;transform:translate(var(--x1),var(--y1)) scale(.4) rotate(160deg)}}
@keyframes fade{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}

@media (max-height:560px){.dock .mini{width:48px;height:48px}.dock{min-height:56px}.hero{width:150px}.bigpic{width:120px}.opt{min-height:80px}.opt svg.pic{max-width:90px}}
@media (min-width:400px){.opts.n4{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .fx{display:none}
}
</style>
</head>
