==========================================================================================
 README – Geheimes Englisch-Camp (one self-contained HTML file)
==========================================================================================
 OPEN ON A PHONE
  - Best: host it (https) and open the URL in Chrome (Android) or Safari (iOS).
  - Local file also works (copy to the phone, open with the browser), but some browsers
    block saving (localStorage) and the microphone on file://. The parent area shows a
    hint when saving is unavailable.

 HOST IT FOR FREE
  - Netlify Drop: go to https://app.netlify.com/drop, drag the folder containing this file
    (rename it to index.html first). You get an https URL in seconds.
  - GitHub Pages: new public repo, upload index.html, Settings > Pages > Deploy from branch
    (main, /root). URL: https://<user>.github.io/<repo>/

 ADD TO THE HOME SCREEN
  - Android/Chrome: menu (three dots) > "Zum Startbildschirm hinzufügen".
  - iOS/Safari: Share button > "Zum Home-Bildschirm".

 VOICES
  - English audio is pre-recorded and embedded (AUDIO block): Piper TTS, voice
    en_GB-cori-high (public domain, trained on LibriVox recordings). Generated offline by
    tts/export-lines.js + tts/make_audio.py; every line has a normal and a slow clip.
  - Lines containing the player's name ("I'm <name>.") have no clip on purpose and use
    the phone's built-in speech voice (speechSynthesis). If nothing
    is heard: Android: Settings > System > Languages > Text-to-speech > install
    "English (United Kingdom)". iOS: Settings > Accessibility > Spoken Content > Voices >
    English > choose a UK voice. Without a voice the app shows the text instead.

 BACKUP PROGRESS
  - Parent area (gear icon, press and hold ~1.5 s, then PIN) > "Backup" >
    "Fortschritt exportieren" downloads a JSON file (and shows it for copying).
    "Importieren" restores it, also on another device. A reminder appears in the parent
    area every 7 days (configurable or off).
  - Progress lives in this browser's localStorage. Clearing browser data deletes it.

 PARENT PIN
  - Set the first time the parent area is opened (4 digits, stored locally).
  - FORGOTTEN PIN: open the app URL with "#pinreset" at the end
    (e.g. https://example.netlify.app/#pinreset), type the confirmation word shown on
    screen; the PIN is removed (progress stays). Then set a new PIN.
  - HONEST NOTE: this is client-side only and NOT real security. It keeps an 11-year-old
    from tapping into settings by accident; anyone with browser dev tools can bypass it.

 DEBUG / CONTENT CHECK
  - Append "#debug" to the URL: shows the startup content validation report on the map
    and extra tools in the parent area (e.g. make all words due for review).
  - The validation always runs at startup; problems are logged to the console.

 ADDING CONTENT
  - See the CONTENT block at the top of the <script>. Add a word = add an object to
    CONTENT.words. Add a level = add an object to CONTENT.levels. New unit = new file
    src/03c-uNN.html calling addWorld({...}). The validation tells you what is missing.
  - Unit 11 runs real Python (Pyodide v0.29.5 from cdn.jsdelivr.net), loaded only when a
    Python task starts. Offline it shows a German hint and offers to skip the task.
==========================================================================================

==========================================================================================
 STORY BIBLE
==========================================================================================
 World: the "Sternbucht-Inseln", an original island region. Trainers travel from town to
 town, help the locals and befriend "Wortmonster" – little creatures made of words that
 grow stronger the more words their trainer knows.

 Player: the trainer (name entered in onboarding). New in the region, a bit
 nervous, secretly very clever. Training happens in a "geheimes Trainingslager" – nobody
 watches, mistakes are just bugs you find and fix.

 Nuvi (companion): round, lavender, fluffy, two big pointy ears, star-tipped tail, a small
 gold star on the forehead. Curious, warm, slightly clumsy, never judgy.
   Voice: short German sentences, "du", lots of encouragement, one emoji max.
   Running jokes: Nuvi always miscounts its biscuits ("Ich hab drei Kekse… nein, vier…
   wo ist der dritte?!"); Nuvi thinks every bug is a real little beetle and wants to
   adopt it. Nuvi is a big fan of Umbreon, Sylveon and Mew and argues with itself which
   one is the best.
 Juno: friendly rival trainer, also new, very chatty, a bit of a show-off but kind. Learns
   alongside the player and sometimes makes the same mistakes. Always hungry.
 Prof. Pixel: runs the Code Lab in a lighthouse. Speaks in short "computer" sentences,
   loves when things "compilen". Explains that computers speak English.
 Brummkrabbe Knarz (Unit 1 boss): grumpy harbour crab who stopped greeting anyone because
   nobody greeted him. Secretly lonely. Becomes friendly after a proper "Hello!".

 Unit 1 – Hallohafen (harbour town, sea breeze, teal accent): the harbour bell is silent
   because nobody greets anymore. Problem: bring back "Hello". Payoff: Knarz says hello,
   the bell rings again.
 Unit 2 – Farbenfeld (meadow, butter-yellow): Grauwolke Nebelino drained the colours.
   Colours, school things; a/an, plural. Code Lab if/else.
 Unit 3 – Regelturm (school tower, sky-blue): Robo Kommandix only shouts orders. Classroom
   rules; imperatives, don't, can/can't, please. Code Lab True/False, and/or.
 Unit 4 – Familienfelsen (cliffs, rose): Hoppel, a shy lost rabbit, looks for his family.
   Family; 's, my/your/his/her. Code Lab lists. Opens Unit 11.
 Unit 5 – Blockdorf (blocky village, terracotta): Blockgolem Klotz wants a home. Rooms,
   furniture; there is/are, in/on/under. Code Lab for loops.
 Unit 6 – Tierwald (forest, moss-green): Zischel the snake hisses because he has no friends.
   Pets, animals; have got/has got. Code Lab while loops.
 Unit 7 – Spielinsel (island, coral): Faultier Gähnix finds everything boring. Hobbies;
   like + -ing, he/she -s. Code Lab functions.
 Unit 8 – Uhrenturm (clock tower, indigo): Zeitwichtel Wusel mixed up days and clocks.
   Weekdays, time, daily routine; he/she -s, always/never. Code Lab input + strings.
 Unit 9 – Marktplatz (market, orange): Möwe Schnapp steals food. Food, shopping; some/any,
   How much …?, I'd like … Code Lab dictionaries.
 Unit 10 – Festbucht (harbour at night, gold): finale party for Glimmer, a shy dragon whose
   birthday nobody knows. Months, birthday, ordinals; present progressive. Code Lab mini project.
 Unit 11 – Pixels Leuchtturm (bonus route, lighthouse at night, mint; opens after Unit 4):
   real Python via Pyodide (loaded from the CDN only here; offline = German hint + skip).
   Words = English words behind Python keywords. Boss: Der Große Bug, who learns that bugs
   help us learn.

 Tone: funny, short, never babyish. English bits inside German text are marked [[like this]].
 Mistake language: "Fast!", "Bug gefunden! Jetzt weißt du's.", "Probier's nochmal 💪".
 Never: "falsch", red alarms, lost lives, guilt ("Du hast gestern nicht geübt").

 STYLE GUIDE
==========================================================================================
 Fonts: Nunito (UI, rounded) with fallbacks Varela Round / Arial Rounded / system-ui.
        Dyslexia toggle: Lexend (fallback Verdana) with extra letter spacing.
 English text: class .en + lang="en-GB", larger, weight 800, colour var(--en).
 Outline: all SVG art uses stroke #4a3b5c, width 3 (icons 24px: currentColor, width 2),
          round joins, big eyes with white highlights, pink blush cheeks, soft disc behind
          word pictures.
 Themes (CSS variables on <html data-theme>):
   sylveon: bg #ffe1ef > #d6ecff, primary #f2559c, secondary #6cbcf5, en #b0246a
   umbreon: bg #1b1937 > #2f2b63, primary gold #f2c14e (dark text), en #ffd76a
   mew:     bg #ffe4ef > #d3f7f0, primary #e85d9f, secondary #34bfae, en #0b7a6e
 Unit accents: u1 teal #2fb3c6, u2 butter #f2b33d, u3 sky #4aa8e8, u4 rose #f07aa0,
   u5 terracotta #d9774f, u6 moss #6f9e3c, u7 coral #ff7f6b, u8 indigo #6a6fd8, u9 orange #ff9a2e,
   u10 gold #d4a017, u11 mint #3cc9a0 (u10/u11 use dark scenes: unit.dark).
 Pastel palette for art: lavender #cdb8f5, mint #b9efd9, peach #ffd2b8, rose #ffc2d6,
   sky #bfe3ff, butter #ffe7a0.
 Components: .btn (chunky, 52px+, 3D bottom shadow, press squash), .card (rounded 22px,
   soft shadow), .chip, .opt (picture option), .sheet (bottom sheet, never blocking),
   .dock (companion + bubble, max 2 lines), .bar (progress), .code (editor look).
 Motion: CSS transforms/opacity only; all loops disabled with prefers-reduced-motion.
