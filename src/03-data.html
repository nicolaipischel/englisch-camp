/* World files (src/03c-uNN.html) register their content here, in map order. */
function addWorld(w) {
  CONTENT.units.push(w.unit);
  ['words', 'levels', 'items', 'badges', 'secrets'].forEach(k => CONTENT[k].push(...(w[k] || [])));
  Object.keys(w.dialogues || {}).forEach(k => { if (CONTENT.dialogues[k]) console.error(`Duplicate dialogue id "${k}" in ${w.unit.id}`); });
  Object.assign(CONTENT.dialogues, w.dialogues || {});
}
