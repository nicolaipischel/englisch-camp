<script>
/* ==========================================================================================
   ART – all graphics are self-drawn inline SVG (outline #4a3b5c, width 3, big eyes, blush).
   ========================================================================================== */
const O = '#4a3b5c';
const SW = 'stroke="#4a3b5c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const svg = (vb, body, cls='', label='', par='') =>
  `<svg viewBox="${vb}" ${par ? `preserveAspectRatio="${par}"` : ''} class="${cls}" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'} xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const starPath = (cx, cy, r, ri = r * .5) => {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? ri : r;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return d + 'Z';
};
const eyes = (x1, x2, y, r = 6) =>
  `<ellipse cx="${x1}" cy="${y}" rx="${r}" ry="${r * 1.3}" fill="${O}"/><ellipse cx="${x2}" cy="${y}" rx="${r}" ry="${r * 1.3}" fill="${O}"/>
   <circle cx="${x1 + r * .35}" cy="${y - r * .5}" r="${r * .42}" fill="#fff"/><circle cx="${x2 + r * .35}" cy="${y - r * .5}" r="${r * .42}" fill="#fff"/>`;
const blush = (x1, x2, y, r = 5) =>
  `<ellipse cx="${x1}" cy="${y}" rx="${r}" ry="${r * .6}" fill="#ff9fb8" opacity=".75"/><ellipse cx="${x2}" cy="${y}" rx="${r}" ry="${r * .6}" fill="#ff9fb8" opacity=".75"/>`;
const disc = c => `<circle cx="50" cy="52" r="42" fill="${c}" opacity=".55"/>`;

const ART = {
  /* ---------- Nuvi, the companion. moods: happy cheer thinking sleepy surprised proud ---------- */
  nuvi(mood = 'happy', cls = '') {
    const body = 'var(--nuvi,#cdb8f5)';
    let face = '';
    const sm = `<path d="M54 84 q6 6 12 0" fill="none" ${SW}/>`;
    switch (mood) {
      case 'cheer':
        face = `<path d="M40 72 q6 -8 12 0 M68 72 q6 -8 12 0" fill="none" ${SW}/><path d="M52 82 q8 12 16 0 z" fill="#ff7a9a" ${SW}/>`; break;
      case 'thinking':
        face = `<g class="nv-eyes"><ellipse cx="46" cy="68" rx="5.5" ry="7" fill="${O}"/><ellipse cx="74" cy="68" rx="5.5" ry="7" fill="${O}"/><circle cx="47" cy="64" r="2.4" fill="#fff"/><circle cx="75" cy="64" r="2.4" fill="#fff"/></g><path d="M55 86 h10" ${SW}/><text x="96" y="40" font-size="22" font-weight="900" fill="${O}" font-family="Nunito,sans-serif">?</text>`; break;
      case 'sleepy':
        face = `<path d="M40 72 h12 M68 72 h12" ${SW}/><ellipse cx="60" cy="86" rx="3.5" ry="4" fill="${O}"/><text x="92" y="36" font-size="16" font-weight="900" fill="${O}" font-family="Nunito,sans-serif">z</text><text x="102" y="24" font-size="12" font-weight="900" fill="${O}" font-family="Nunito,sans-serif">z</text>`; break;
      case 'surprised':
        face = `<g class="nv-eyes">${eyes(46, 74, 70, 7)}</g><ellipse cx="60" cy="87" rx="4.5" ry="5.5" fill="#ff7a9a" ${SW}/>`; break;
      case 'proud':
        face = `<path d="M40 70 q6 6 12 0 M68 70 q6 6 12 0" fill="none" ${SW}/>${sm}<path d="${starPath(100, 40, 8)}" fill="#ffd76a" ${SW}/>`; break;
      default:
        face = `<g class="nv-eyes">${eyes(46, 74, 71, 6)}</g>${sm}`;
    }
    return svg('0 0 124 120', `<g class="nv-all">
      <g class="nv-tail"><path d="M90 94 q24 -4 20 -30" fill="none" stroke="${O}" stroke-width="6" stroke-linecap="round"/><path d="M90 94 q24 -4 20 -30" fill="none" stroke="${body}" stroke-width="2.5" stroke-linecap="round"/><path d="${starPath(110, 60, 9)}" fill="#ffd76a" ${SW}/></g>
      <g class="nv-earl"><path d="M38 50 L26 10 Q48 18 54 40 Z" fill="${body}" ${SW}/><path d="M38 42 L31 19 Q44 25 47 38 Z" fill="#ffc2d6"/></g>
      <g class="nv-earr"><path d="M82 50 L94 10 Q72 18 66 40 Z" fill="${body}" ${SW}/><path d="M82 42 L89 19 Q76 25 73 38 Z" fill="#ffc2d6"/></g>
      <ellipse cx="44" cy="110" rx="10" ry="6" fill="${body}" ${SW}/><ellipse cx="76" cy="110" rx="10" ry="6" fill="${body}" ${SW}/>
      <ellipse cx="60" cy="76" rx="38" ry="34" fill="${body}" ${SW}/>
      <ellipse cx="60" cy="92" rx="20" ry="13" fill="#fff6ee" opacity=".9"/>
      <path d="${starPath(60, 50, 6)}" fill="#ffd76a" ${SW.replace('3"', '2"')}/>
      ${blush(38, 82, 82, 6)}${face}</g>`, 'nuvi ' + cls, 'Nuvi');
  },

  /* ---------- trainer avatars ---------- */
  avatars: [
    { hair:'#6b4430', skin:'#ffd9c2', style:'long', shirt:'#ff8fc0' },
    { hair:'#2f2a3a', skin:'#f1c19b', style:'bob',  shirt:'#7cc4ff' },
    { hair:'#e3a73f', skin:'#ffe2cf', style:'pony', shirt:'#8fdcc0' },
    { hair:'#8e5cc4', skin:'#c98f63', style:'buns', shirt:'#ffd36e' }
  ],
  avatar(i = 0, equip = {}, label = 'Dein Avatar') {
    const a = ART.avatars[i] || ART.avatars[0];
    const back = {
      long: `<path d="M22 52 Q20 18 50 16 Q80 18 78 52 L80 86 Q50 94 20 86 Z" fill="${a.hair}" ${SW}/>`,
      bob:  `<path d="M20 56 Q18 16 50 15 Q82 16 80 56 Q80 68 70 68 L30 68 Q20 68 20 56 Z" fill="${a.hair}" ${SW}/>`,
      pony: `<path d="M74 30 q24 6 18 38 q-8 -12 -18 -16 Z" fill="${a.hair}" ${SW}/><path d="M22 52 Q20 18 50 16 Q80 18 78 52 Z" fill="${a.hair}" ${SW}/>`,
      buns: `<circle cx="27" cy="22" r="11" fill="${a.hair}" ${SW}/><circle cx="73" cy="22" r="11" fill="${a.hair}" ${SW}/><path d="M22 52 Q20 18 50 16 Q80 18 78 52 Z" fill="${a.hair}" ${SW}/>`
    }[a.style];
    const bangs = a.style === 'bob'
      ? `<path d="M25 46 Q26 22 50 20 Q74 22 75 46 Q64 38 50 40 Q36 38 25 46 Z" fill="${a.hair}" ${SW}/>`
      : `<path d="M25 46 Q28 20 50 20 Q72 20 75 46 Q66 32 52 34 Q44 40 25 46 Z" fill="${a.hair}" ${SW}/>`;
    const acc = (equip.head ? ART.acc(equip.head) : '') + (equip.face ? ART.acc(equip.face) : '');
    return svg('0 0 100 100', `${back}
      <path d="M24 100 Q26 80 50 80 Q74 80 76 100 Z" fill="${a.shirt}" ${SW}/>
      <rect x="44" y="72" width="12" height="10" fill="${a.skin}" ${SW}/>
      <circle cx="50" cy="52" r="26" fill="${a.skin}" ${SW}/>
      ${bangs}${eyes(41, 59, 56, 3.6)}${blush(35, 65, 64, 4)}
      <path d="M45 66 q5 4 10 0" fill="none" ${SW}/>${acc}`, 'avatar', label);
  },
  acc(id) {
    switch (id) {
      case 'acc_cap': return `<path d="M24 36 Q24 12 50 12 Q76 12 76 36 Z" fill="#ff7fa8" ${SW}/><path d="M50 34 h30 q6 2 0 7 h-30 z" fill="#ff7fa8" ${SW}/><circle cx="50" cy="24" r="6" fill="#fff" ${SW}/><path d="M44 24 h12" ${SW}/>`;
      case 'acc_bow': return `<path d="M66 22 l-12 -10 v20 z M66 22 l12 -10 v20 z" fill="#ff9fd0" ${SW}/><circle cx="66" cy="22" r="4" fill="#ffd76a" ${SW}/>`;
      case 'acc_phones': return `<path d="M22 52 Q22 12 50 12 Q78 12 78 52" fill="none" stroke="${O}" stroke-width="7" stroke-linecap="round"/><path d="M22 52 Q22 12 50 12 Q78 12 78 52" fill="none" stroke="#9fd8ff" stroke-width="3" stroke-linecap="round"/><rect x="14" y="44" width="12" height="20" rx="6" fill="#9fd8ff" ${SW}/><rect x="74" y="44" width="12" height="20" rx="6" fill="#9fd8ff" ${SW}/>`;
      case 'acc_clip': return `<path d="M32 26 a9 9 0 1 0 8 12 a7 7 0 1 1 -8 -12 z" fill="#ffe08a" ${SW}/>`;
      case 'acc_crown': return `<path d="M30 26 v-16 l8 6 l6 -10 h12 l6 10 l8 -6 v16 z" fill="#ffd34d" ${SW}/><rect x="46" y="14" width="8" height="8" fill="#ff8fc0" ${SW}/>`;
      case 'acc_glasses': return `<circle cx="41" cy="56" r="8" fill="#bfe3ff" fill-opacity=".35" ${SW}/><circle cx="59" cy="56" r="8" fill="#bfe3ff" fill-opacity=".35" ${SW}/><path d="M49 56 h2 M33 54 l-8 -3 M67 54 l8 -3" ${SW}/>`;
    }
    return '';
  },
  accIcon(id, cls = 'it', label = '') {
    const vb = id === 'acc_glasses' ? '24 40 52 32' : id === 'acc_phones' ? '8 6 84 64' : '18 2 64 46';
    return svg(vb, ART.acc(id), cls, label);
  },

  /* ---------- word pictures (viewBox 0 0 100 100) ---------- */
  icons: {
    wave: () => `${disc('#ffe7a0')}
      <rect x="37" y="22" width="8" height="30" rx="4" fill="#ffd9c2" ${SW}/><rect x="46" y="17" width="8" height="34" rx="4" fill="#ffd9c2" ${SW}/>
      <rect x="55" y="19" width="8" height="32" rx="4" fill="#ffd9c2" ${SW}/><rect x="64" y="26" width="8" height="26" rx="4" fill="#ffd9c2" ${SW}/>
      <rect x="33" y="40" width="9" height="26" rx="4.5" fill="#ffd9c2" ${SW} transform="rotate(-35 37.5 64)"/>
      <path d="M36 46 h37 v18 q0 16 -18 16 q-19 0 -19 -16 z" fill="#ffd9c2" ${SW}/>
      <path d="M80 26 q7 7 0 15 M86 20 q12 13 0 27 M22 30 q-7 7 0 15" fill="none" ${SW}/>`,
    bye: () => `${disc('#bfe3ff')}
      <rect x="22" y="20" width="40" height="64" rx="4" fill="#5c4a7a" ${SW}/>
      <path d="M62 20 L82 28 L82 90 L62 84 Z" fill="#ffcf8a" ${SW}/><circle cx="67" cy="56" r="3" fill="${O}"/>
      <path d="M30 52 h24 M46 43 l9 9 l-9 9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 86 h76" ${SW}/>`,
    yes: () => `${disc('#b9efd9')}<circle cx="50" cy="52" r="30" fill="#fff" ${SW}/>
      <path d="M36 53 l10 11 l20 -24" fill="none" stroke="#1f9a72" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${starPath(84, 22, 6)}" fill="#ffd76a" ${SW}/>`,
    no: () => `${disc('#ffc2d6')}<circle cx="50" cy="52" r="30" fill="#fff" ${SW}/>
      <path d="M38 40 l24 24 M62 40 l-24 24" fill="none" stroke="#d94f78" stroke-width="9" stroke-linecap="round"/>`,
    nameq: () => `${disc('#cdb8f5')}
      <path d="M14 22 h72 q6 0 6 6 v36 q0 6 -6 6 h-44 l-14 14 v-14 h-14 q-6 0 -6 -6 v-36 q0 -6 6 -6 z" fill="#fff" ${SW}/>
      <rect x="22" y="32" width="56" height="26" rx="6" fill="#ffc2d6" ${SW}/>
      <path d="M30 48 h20" ${SW}/><text x="66" y="54" font-size="22" font-weight="900" text-anchor="middle" fill="${O}" font-family="Nunito,sans-serif">?</text>`,
    name: () => `${disc('#ffd2b8')}
      <path d="M26 96 Q28 66 50 66 Q72 66 74 96 Z" fill="#8fdcc0" ${SW}/>
      <circle cx="50" cy="40" r="18" fill="#ffd9c2" ${SW}/><path d="M32 38 Q34 20 50 20 Q66 20 68 38 Q58 30 50 31 Q42 30 32 38 Z" fill="#6b4430" ${SW}/>
      ${eyes(44, 56, 42, 2.6)}<path d="M46 50 q4 3 8 0" fill="none" ${SW}/>
      <rect x="40" y="74" width="22" height="13" rx="3" fill="#fff" ${SW}/><path d="${starPath(47, 80.5, 3.6)}" fill="#ffd76a"/><path d="M52 80 h6" ${SW.replace('3"', '2"')}/>
      <path d="M78 66 l-10 10" fill="none" ${SW}/><circle cx="80" cy="64" r="5" fill="#ffd9c2" ${SW}/>`,
    howq: () => `${disc('#bfe3ff')}
      <circle cx="26" cy="62" r="14" fill="#fff" ${SW}/>${eyes(22, 30, 59, 1.8)}<path d="M21 67 q5 4 10 0" fill="none" ${SW}/>
      <circle cx="74" cy="62" r="14" fill="#fff" ${SW}/>${eyes(70, 78, 59, 1.8)}<path d="M69 69 q5 -4 10 0" fill="none" ${SW}/>
      <circle cx="50" cy="52" r="16" fill="#fff" ${SW}/>${eyes(45, 55, 49, 2)}<path d="M44 59 h12" ${SW}/>
      <text x="50" y="27" font-size="24" font-weight="900" text-anchor="middle" fill="${O}" font-family="Nunito,sans-serif">?</text>`,
    fine: () => `${disc('#ffe7a0')}
      <circle cx="50" cy="54" r="28" fill="#ffd76a" ${SW}/>
      <path d="M38 50 q4 -5 8 0 M54 50 q4 -5 8 0" fill="none" ${SW}/>${blush(36, 64, 60, 4)}
      <path d="M38 62 q12 14 24 0 z" fill="#ff7a9a" ${SW}/>
      <path d="M78 18 c-4 -6 -14 -2 -9 6 l9 8 l9 -8 c5 -8 -5 -12 -9 -6 z" fill="#ff8fb2" ${SW}/>`
  },
  numberPic(n) {
    const cols = ['#8fd3f4', '#f7a8c8', '#b8e986', '#ffd36e', '#c3b1f5'];
    const per = n <= 5 ? n : Math.ceil(n / 2), rows = n <= 5 ? 1 : 2, s = 16, g = 3;
    let b = '';
    for (let i = 0; i < n; i++) {
      const row = i < per ? 0 : 1, col = row ? i - per : i;
      const w = per * (s + g) - g, x = (100 - w) / 2 + col * (s + g), y = (rows === 1 ? 54 : 44) + row * (s + g + 2);
      b += `<g transform="translate(${x.toFixed(1)} ${y})"><rect width="${s}" height="${s}" rx="3" fill="${cols[i % 5]}" stroke="${O}" stroke-width="2"/><rect x="3" y="3" width="${s - 6}" height="4" rx="2" fill="#fff" opacity=".6"/></g>`;
    }
    return `${disc('#e6f6ff')}<circle cx="50" cy="22" r="16" fill="#fff" ${SW}/><text x="50" y="29.5" font-size="${n > 9 ? 17 : 21}" font-weight="900" text-anchor="middle" fill="${O}" font-family="Nunito,sans-serif">${n}</text>${b}`;
  },
  pic(word, cls = 'pic', withLabel = true) {
    if (!word) return '';
    let body = '';
    if (word.emoji) body = `${disc('#ffe7a0')}<text x="50" y="54" font-size="56" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">${word.emoji}</text>`;
    else if (/^num:\d+$/.test(word.icon)) body = ART.numberPic(+word.icon.slice(4));
    else if (ART.icons[word.icon]) body = ART.icons[word.icon]();
    return svg('0 0 100 100', body, cls, withLabel ? 'Bild' : '');
  },

  /* ---------- word monsters (3 stages each, distinct silhouettes) ---------- */
  monster(id, cls = 'mon', label = '') {
    const m = {
      plaudi1: `<path d="M20 50 Q20 22 50 22 Q80 22 80 50 Q80 76 52 78 L34 90 L38 76 Q20 70 20 50 Z" fill="#9ee6e0" ${SW}/>
        ${eyes(40, 60, 48, 5)}${blush(32, 68, 58, 5)}<path d="M45 60 q5 5 10 0" fill="none" ${SW}/>
        <circle cx="66" cy="30" r="3" fill="#fff"/>`,
      plaudi2: `<path d="M14 50 q-10 -8 -4 -18 q8 4 12 14 z M86 50 q10 -8 4 -18 q-8 4 -12 14 z" fill="#c3b1f5" ${SW}/>
        <path d="M18 54 Q18 20 50 20 Q82 20 82 54 Q82 84 50 86 Q18 84 18 54 Z" fill="#7fd8d0" ${SW}/>
        <path d="M50 20 q-4 -12 6 -14 q8 2 2 8" fill="none" ${SW}/><circle cx="58" cy="9" r="4" fill="#ffd76a" ${SW}/>
        ${eyes(39, 61, 50, 6)}${blush(30, 70, 62, 5)}<path d="M43 64 q7 7 14 0" fill="none" ${SW}/>
        <ellipse cx="50" cy="76" rx="14" ry="6" fill="#fff" opacity=".7"/>`,
      plaudi3: `<path d="M28 30 l4 -20 l10 14 l8 -18 l8 18 l10 -14 l4 20 z" fill="#ffd76a" ${SW}/>
        <path d="M10 60 q-6 -22 14 -26 q-2 16 6 26 z M90 60 q6 -22 -14 -26 q2 16 -6 26 z" fill="#c3b1f5" ${SW}/>
        <path d="M20 58 Q20 26 50 26 Q80 26 80 58 Q80 90 50 92 Q20 90 20 58 Z" fill="#4fc4ba" ${SW}/>
        <path d="M80 80 q14 0 12 -14" fill="none" ${SW}/><path d="${starPath(92, 62, 7)}" fill="#ffd76a" ${SW}/>
        ${eyes(39, 61, 54, 6.5)}${blush(30, 70, 66, 5)}<path d="M42 68 q8 9 16 0 z" fill="#ff7a9a" ${SW}/>
        <path d="M34 82 h32" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>`,
      locked: `<circle cx="50" cy="52" r="34" fill="#c9c2dc" ${SW}/><text x="50" y="64" font-size="34" font-weight="900" text-anchor="middle" fill="#fff" font-family="Nunito,sans-serif">?</text>`
    }[id] || '';
    return svg('0 0 100 100', m, cls, label);
  },

  /* ---------- boss: Brummkrabbe Knarz ---------- */
  crab(mood = 'grumpy', cls = '') {
    const brow = mood === 'grumpy' ? `<path d="M54 26 l14 6 M106 26 l-14 6" ${SW}/>` : '';
    const mouth = mood === 'happy' ? `<path d="M70 64 q10 10 20 0" fill="none" ${SW}/>` : `<path d="M70 68 q10 -7 20 0" fill="none" ${SW}/>`;
    return svg('0 0 160 120', `
      <path d="M30 56 q-22 -8 -20 -30 q12 2 18 12 q4 -12 16 -12 q2 18 -14 30 z" fill="#ff9e8a" ${SW}/>
      <path d="M130 56 q22 -8 20 -30 q-12 2 -18 12 q-4 -12 -16 -12 q-2 18 14 30 z" fill="#ff9e8a" ${SW}/>
      <path d="M44 92 l-16 16 M56 98 l-8 18 M116 92 l16 16 M104 98 l8 18" ${SW}/>
      <ellipse cx="80" cy="70" rx="48" ry="32" fill="#ffb3a0" ${SW}/>
      <path d="M62 40 v-12 M98 40 v-12" ${SW}/>
      <circle cx="62" cy="24" r="9" fill="#fff" ${SW}/><circle cx="98" cy="24" r="9" fill="#fff" ${SW}/>
      <circle cx="63" cy="26" r="4" fill="${O}"/><circle cx="97" cy="26" r="4" fill="${O}"/>${brow}
      ${blush(56, 104, 66, 7)}${mouth}
      <path d="M50 84 q30 12 60 0" fill="none" stroke="#fff" stroke-width="3" opacity=".6" stroke-linecap="round"/>`, cls, 'Knarz');
  },
  juno() {
    return svg('0 0 100 100', `<path d="M22 54 Q18 14 50 14 Q82 14 78 54 Z" fill="#ff8a65" ${SW}/>
      <path d="M24 100 Q26 80 50 80 Q74 80 76 100 Z" fill="#c3b1f5" ${SW}/>
      <circle cx="50" cy="52" r="25" fill="#f6c7a4" ${SW}/>
      <path d="M26 44 Q30 22 50 22 Q70 22 74 44 L64 36 L56 42 L48 34 L40 42 L34 36 Z" fill="#ff8a65" ${SW}/>
      ${eyes(41, 59, 55, 3.4)}${blush(35, 65, 63, 4)}<path d="M44 64 q6 6 12 0 z" fill="#ff7a9a" ${SW}/>`, '', 'Juno');
  },

  /* ---------- room items & room ---------- */
  item(id, cls = 'it', label = '') {
    const it = CONTENT.items.find(i => i.id === id);
    if (it && it.kind === 'acc') return ART.accIcon(id, cls, label);
    const b = {
      room_plant: `<path d="M20 40 h24 v20 h-24 z" fill="#c98f63" ${SW}/><path d="M20 40 h24 v6 h-24 z" fill="#e0a877" ${SW}/>
        <path d="M32 40 v-14" ${SW}/><rect x="16" y="14" width="12" height="12" fill="#7ccf6a" ${SW}/><rect x="34" y="8" width="12" height="12" fill="#5fb85a" ${SW}/><rect x="26" y="2" width="10" height="10" fill="#8fe07c" ${SW}/>`,
      room_lamp: `<path d="M24 60 h16 M32 60 v-28" ${SW}/><path d="M32 30 a14 14 0 1 0 12 -20 a11 11 0 1 1 -12 20 z" fill="#ffe08a" ${SW}/>`,
      room_rug: `<path d="M6 44 q0 -14 14 -12 q4 -12 18 -8 q8 -8 18 2 q10 2 4 18 z" fill="#d6ecff" ${SW}/><circle cx="24" cy="38" r="2" fill="${O}"/><circle cx="40" cy="36" r="2" fill="${O}"/>`,
      room_pc: `<rect x="6" y="8" width="52" height="34" rx="5" fill="#3a3160" ${SW}/><text x="32" y="31" font-size="14" text-anchor="middle" fill="#9be7b4" font-family="monospace" font-weight="700">&lt;/&gt;</text>
        <path d="M26 42 v8 h12 v-8" fill="#c9c2dc" ${SW}/><rect x="12" y="52" width="40" height="8" rx="3" fill="#ffc2d6" ${SW}/>`,
      room_poster: `<rect x="8" y="6" width="48" height="52" rx="4" fill="#3a3580" ${SW}/><path d="${starPath(32, 30, 14)}" fill="#ffd76a" ${SW}/><circle cx="16" cy="14" r="2" fill="#fff"/><circle cx="48" cy="48" r="2" fill="#fff"/>`,
      room_bed: `<rect x="4" y="24" width="10" height="34" rx="3" fill="#c98f63" ${SW}/><rect x="10" y="34" width="50" height="18" rx="6" fill="#ffc2d6" ${SW}/>
        <rect x="14" y="28" width="16" height="10" rx="5" fill="#fff" ${SW}/><path d="M10 52 h50 v6 h-50 z" fill="#c98f63" ${SW}/>`,
      room_shelf: `<rect x="8" y="6" width="48" height="52" fill="#e0a877" ${SW}/><path d="M8 32 h48" ${SW}/>
        <rect x="14" y="14" width="6" height="18" fill="#7cc4ff" ${SW.replace('3"', '2"')}/><rect x="22" y="12" width="6" height="20" fill="#ff8fc0" ${SW.replace('3"', '2"')}/>
        <rect x="38" y="40" width="12" height="12" fill="#8fdcc0" ${SW.replace('3"', '2"')}/>`,
      room_bean: `<path d="M10 56 q-6 -30 22 -36 q26 2 22 36 z" fill="#c3b1f5" ${SW}/><path d="M20 40 q12 -6 22 0" fill="none" ${SW}/>`,
      room_shell: `<path d="M32 54 L10 28 Q32 4 54 28 Z" fill="#ffd2e6" ${SW}/><path d="M32 54 L22 22 M32 54 L32 16 M32 54 L42 22" ${SW}/><path d="${starPath(52, 12, 6)}" fill="#ffd76a" ${SW}/>`
    }[id] || '';
    return svg('0 0 64 64', b, cls, label);
  },
  roomBg() {
    return svg('0 0 400 300', `<defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe9ff"/><stop offset="1" stop-color="#ffe9f2"/></linearGradient></defs>
      <rect width="400" height="300" fill="url(#wl)"/>
      <path d="M0 0 h400 v20 h-400z" fill="#f3d6ef"/>
      <rect x="150" y="30" width="100" height="70" rx="8" fill="#bfe3ff" stroke="${O}" stroke-width="3"/><path d="M200 30 v70 M150 65 h100" stroke="${O}" stroke-width="3"/>
      <path d="${starPath(175, 48, 6)}" fill="#fff"/>
      <path d="M0 210 h400 v90 h-400z" fill="#e8cfae"/><path d="M0 210 h400" stroke="${O}" stroke-width="3"/>
      ${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<path d="M${i * 56} 210 l-30 90" stroke="#d4b892" stroke-width="2"/>`).join('')}`);
  },

  /* ---------- badges ---------- */
  badge(b, owned = true, cls = 'it') {
    const em = {
      star: `<path d="${starPath(50, 48, 18)}" fill="#ffd76a" ${SW}/>`,
      ear: `<path d="M40 64 q-10 -6 -8 -20 q2 -16 18 -16 q16 0 16 16 q0 10 -10 14 q-6 4 -6 12 q-4 6 -10 -6 z" fill="#ffd9c2" ${SW}/><path d="M46 46 q4 -8 10 -2" fill="none" ${SW}/>`,
      bug: `<ellipse cx="50" cy="52" rx="16" ry="18" fill="#ff7a8a" ${SW}/><path d="M50 34 v36" ${SW}/><circle cx="50" cy="32" r="8" fill="${O}"/><circle cx="43" cy="48" r="3" fill="${O}"/><circle cx="57" cy="58" r="3" fill="${O}"/><path d="M34 46 l-6 -4 M34 58 l-7 2 M66 46 l6 -4 M66 58 l7 2" ${SW}/>`,
      code: `<text x="50" y="58" font-size="26" font-weight="900" text-anchor="middle" fill="${O}" font-family="monospace">&lt;/&gt;</text>`,
      mic: `<rect x="42" y="28" width="16" height="28" rx="8" fill="#c3b1f5" ${SW}/><path d="M36 50 q14 18 28 0 M50 64 v8" fill="none" ${SW}/>`,
      flame: `<path d="M50 72 q-18 -2 -16 -20 q2 -12 12 -20 q0 10 8 12 q2 -10 -2 -16 q16 8 16 26 q0 18 -18 18 z" fill="#ffad5c" ${SW}/><text x="50" y="66" font-size="16" font-weight="900" text-anchor="middle" fill="${O}" font-family="Nunito,sans-serif">7</text>`,
      cycle: `<path d="M34 50 a16 16 0 0 1 28 -10 M66 50 a16 16 0 0 1 -28 10" fill="none" ${SW}/><path d="M62 30 v10 h-10 M38 70 v-10 h10" fill="none" ${SW}/>`,
      chest: `<rect x="32" y="42" width="36" height="24" rx="3" fill="#e0a877" ${SW}/><path d="M32 42 q0 -12 18 -12 q18 0 18 12 z" fill="#c98f63" ${SW}/><rect x="46" y="46" width="8" height="8" fill="#ffd76a" ${SW}/>`,

    }[b.emblem] || '';
    const ring = owned ? '#ffc2d6' : '#ddd6ea';
    return svg('0 0 100 100', `<path d="M36 78 l-8 18 l12 -4 l6 10 l4 -20 M64 78 l8 18 l-12 -4 l-6 10 l-4 -20" fill="#7cc4ff" ${SW}/>
      <circle cx="50" cy="50" r="34" fill="${ring}" ${SW}/><circle cx="50" cy="50" r="26" fill="#fff" ${SW}/>${em}`, cls + (owned ? '' : ' locked'), b.name);
  },

  /* ---------- small UI pieces ---------- */
  ball(cls = '') {
    /* "Wortkugel": swirl-split orb with a star core – deliberately not a horizontal two-tone ball */
    return svg('0 0 64 64', `<circle cx="32" cy="32" r="26" fill="#c9f0ec" ${SW}/>
      <path d="M32 6 a26 26 0 0 1 0 52 a13 13 0 0 1 0 -26 a13 13 0 0 0 0 -26 z" fill="var(--pri,#f2559c)" ${SW}/>

  coin(cls = '') { return svg('0 0 24 24', `<circle cx="12" cy="12" r="10" fill="#ffd34d" stroke="${O}" stroke-width="2"/><path d="${starPath(12, 12, 5)}" fill="#fff3b0"/>`, cls); },
  star(on = true, cls = '') { return svg('0 0 24 24', `<path d="${starPath(12, 12.5, 10.5, 5.2)}" fill="${on ? '#ffd34d' : '#e3dbef'}" stroke="${O}" stroke-width="2" stroke-linejoin="round"/>`, cls + (on ? ' on' : '')); },
  flame(cls = '') { return svg('0 0 24 24', `<path d="M12 22 q-7 -1 -7 -8 q0 -5 5 -9 q0 4 3 5 q1 -4 -1 -7 q8 4 8 11 q0 8 -8 8 z" fill="#ffad5c" stroke="${O}" stroke-width="2" stroke-linejoin="round"/>`, cls); },
  gift(open = false) {
    return svg('0 0 120 120', open
      ? `<rect x="22" y="58" width="76" height="50" rx="8" fill="#c3b1f5" ${SW}/><rect x="54" y="58" width="12" height="50" fill="#ffd76a" ${SW}/><path d="M16 46 l84 -18 l3 14 l-84 18 z" fill="#ff8fc0" ${SW}/>`
      : `<rect x="22" y="52" width="76" height="56" rx="8" fill="#c3b1f5" ${SW}/><rect x="16" y="38" width="88" height="18" rx="6" fill="#ff8fc0" ${SW}/>
         <rect x="54" y="38" width="12" height="70" fill="#ffd76a" ${SW}/><path d="M60 38 q-24 -24 -26 -4 q2 8 26 4 q24 4 26 -4 q-2 -20 -26 4" fill="#ffd76a" ${SW}/>`);
  },
  fx(kind) {
    return kind === 'heart'
      ? svg('0 0 24 24', `<path d="M12 21 l-8 -8 a5 5 0 0 1 8 -6 a5 5 0 0 1 8 6 z" fill="#ff8fb2"/>`)
      : svg('0 0 24 24', `<path d="${starPath(12, 12, 11)}" fill="#ffd34d"/>`);
  },

  /* ---------- unit map scenes (decor only) ---------- */
  scene(kind, h) {
    if (kind === 'harbour') return svg(`0 0 400 ${h}`, `<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8f4fb"/><stop offset=".35" stop-color="#bfeaf2"/><stop offset="1" stop-color="#9ddde8"/></linearGradient></defs>
      <rect width="400" height="${h}" fill="url(#sea)"/>
      ${Array.from({ length: Math.ceil(h / 120) }, (_, i) => `<path d="M0 ${150 + i * 120} q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>`).join('')}
      <g transform="translate(330 40)"><path d="M10 90 l6 -70 h18 l6 70 z" fill="#fff" ${SW}/><path d="M12 64 h36 M14 42 h22" stroke="#ff8fb2" stroke-width="8"/><path d="M10 90 l6 -70 h18 l6 70 z" fill="none" ${SW}/><rect x="14" y="8" width="22" height="14" rx="3" fill="#ffe08a" ${SW}/><path d="M12 8 l13 -10 l13 10 z" fill="#ff8fb2" ${SW}/></g>
      <g transform="translate(26 ${Math.max(200, h - 130)})"><path d="M0 30 h60 l-10 18 h-40 z" fill="#ffd2b8" ${SW}/><path d="M30 30 v-30 l22 26 z" fill="#fff" ${SW}/></g>
      <g transform="translate(300 ${Math.max(260, h - 60)})"><path d="M0 20 q20 -20 40 0" fill="none" ${SW}/><path d="M6 20 q14 -10 28 0" fill="#ff9e8a" opacity=".5"/></g>`, '', '', 'xMidYMin slice');
    return svg('0 0 400 200', `<rect width="400" height="200" fill="#eee"/>`);
  }
};
